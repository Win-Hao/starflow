<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nova · hero</title>
    <style>
      :root {
        --bg: #000000; --fg: #ffffff; --fg-2: #fafafa; --muted: #ffffff99; --meta: #ffffff70;
        --accent: #ffffff; --accent-on: #000000; --accent-hover: #ffffffe6;
        --font-display: "OpenAI Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-body: var(--font-display);
        --astra-glass: #ffffff1f; --astra-glass-hover: #ffffff33;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 400 17px / 1.65 var(--font-body); letter-spacing: -0.01em; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y pinch-zoom; cursor: grab; }
      canvas:active { cursor: grabbing; }
      /* Copy sits at the bottom-left; the galaxy is offset to the right so they never overlap. */
      .copy { position: fixed; left: clamp(20px, 6vw, 96px); bottom: clamp(40px, 8vh, 96px); max-width: 560px; pointer-events: none; }
      .copy a { pointer-events: auto; }
      .eyebrow { margin: 0 0 12px; font: 500 13px / 1.5 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--meta); }
      h1 { margin: 0 0 16px; font: 500 clamp(36px, 6vw, 64px) / 1.02 var(--font-display); letter-spacing: -0.03em; text-wrap: balance; }
      .lede { margin: 0 0 24px; font-size: 18px; color: var(--muted); text-wrap: pretty; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 12px 16px; margin-right: 8px; border-radius: 9999px; font: 500 14px / 1 var(--font-body); letter-spacing: 0; text-decoration: none; transition: background-color 300ms cubic-bezier(0.6, 0, 0.4, 1); }
      .btn-primary { background: var(--accent); color: var(--accent-on); }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-glass { background: var(--astra-glass); color: var(--fg); }
      .btn-glass:hover { background: var(--astra-glass-hover); }
    </style>
  </head>
  <body>
    <canvas id="astra" aria-hidden="true"></canvas>
    <div class="copy">
      <p class="eyebrow">Introducing</p>
      <h1>Nova 2</h1>
      <p class="lede">A new generation of intelligence. Drag to rotate the galaxy; move across it to push the stars aside.</p>
      <a class="btn btn-primary" href="#">Try Nova 2</a><a class="btn btn-glass" href="#">Read the research</a>
    </div>
    <script type="module">
      import { createAstraScene, detectWebGL, prefersReducedMotion, renderStaticFallback, PATH_PRESETS, DEFAULT_SHAPE_SETTINGS, ICON_PRESETS } from './starflow.js'

      // ?shape=cursor | openai-knot   → the page's path shapes
      // ?text=6 | ?icon=heart          → rasterised text / icon (also: {type:'svg', markup} or {type:'image', src})
      // no params                      → the galaxy
      const params = new URLSearchParams(location.search)
      const canvas = document.getElementById('astra')
      const preset = PATH_PRESETS[params.get('shape')]
      const source = preset
        ? { type: 'paths', paths: preset.paths, viewBox: preset.viewBox }
        : params.has('icon')
          ? { type: 'svg', markup: (ICON_PRESETS[params.get('icon')] ?? ICON_PRESETS.heart).markup }
          : params.has('text')
            ? { type: 'text', value: params.get('text') || '6', fontWeight: 700 }
            : { type: 'galaxy' }
      const settings = { ...DEFAULT_SHAPE_SETTINGS, ...(preset?.settings ?? {}) }
      const fieldOptions = { starCount: settings.starCount, scatter: settings.scatter, brightRetention: settings.brightRetention, size: 2.05, palette: 'astra' }

      if (!detectWebGL() || prefersReducedMotion()) {
        renderStaticFallback(canvas, source, fieldOptions)
      } else {
        const astra = createAstraScene(canvas, {
          flowSpeed: settings.flowSpeed,
          dimSizeScale: settings.dimSizeScale,
          fillX: settings.fillX,
          fillY: settings.fillY,
          ambientOpacity: settings.ambient,
          vignette: 0.85,
          // Shift the galaxy right by a quarter viewport so the copy column stays clear. Units: half-viewports.
          center: [0.25, 0],
        })
        astra.setSource(source, fieldOptions)
        window.__astra = astra
      }
    </script>
  </body>
</html>
