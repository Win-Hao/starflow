<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starflow 实验室 · 任意数字与图标</title>
    <link rel="stylesheet" href="/src/lab.css" />
  </head>
  <body data-i18n-title="lab.title">
    <div class="stage">
      <canvas id="astra" aria-hidden="true"></canvas>
      <p class="hint" data-i18n="lab.hint">拖动旋转 · 快速划过推开星尘</p>
    </div>

    <aside class="panel" id="panel">
      <header>
        <h1><span data-i18n="lab.heading">Starflow 实验室</span> <a class="back" href="./" data-i18n="lab.home">← 主页</a></h1>
        <div class="head-actions"><button type="button" id="lang" class="lang">EN</button><button type="button" id="toggle" data-i18n-aria="lab.collapse" aria-label="收起面板">－</button></div>
      </header>

      <div class="body">
        <section>
          <label class="row">
            <span data-i18n="lab.source">形状来源</span>
            <select id="mode">
              <option value="galaxy" data-i18n="lab.source.galaxy">原站星系（GPT-6）</option>
              <option value="text" data-i18n="lab.source.text">文字 / 数字</option>
              <option value="icon" data-i18n="lab.source.icon">内置图标</option>
              <option value="svg" data-i18n="lab.source.svg">粘贴 SVG</option>
              <option value="file" data-i18n="lab.source.file">上传文件</option>
            </select>
          </label>

          <div data-mode="galaxy">
            <p class="note" data-i18n="lab.galaxyNote">原站的 5 条手绘螺旋曲线 + 星系核，逐星与原站一致。</p>
          </div>

          <div data-mode="text" hidden>
            <label class="row"><span data-i18n="lab.text">内容</span><input id="text" type="text" value="6" maxlength="12" /></label>
            <div class="chips" id="textChips"></div>
            <label class="row"><span data-i18n="lab.weight">字重</span>
              <select id="weight">
                <option value="300">300</option>
                <option value="500">500</option>
                <option value="700" selected>700</option>
                <option value="900">900</option>
              </select>
            </label>
          </div>

          <div data-mode="icon" hidden>
            <label class="row"><span data-i18n="lab.icon">图标</span><select id="icon"></select></label>
          </div>

          <div data-mode="svg" hidden>
            <textarea id="svg" rows="5" data-i18n-placeholder="lab.svgPlaceholder" placeholder="粘贴完整 <svg>…</svg> 源码"></textarea>
            <button type="button" id="applySvg" class="wide" data-i18n="lab.applySvg">应用 SVG</button>
          </div>

          <div data-mode="file" hidden>
            <input id="file" type="file" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp" />
            <p class="note" data-i18n="lab.fileNote">SVG 走矢量轮廓；位图按亮度取形状，建议用黑底白图。</p>
          </div>
        </section>

        <section>
          <h2 data-i18n="lab.field">星场</h2>
          <label class="row"><span><span data-i18n="lab.starCount">星数</span> <b id="v-starCount"></b></span><input id="starCount" type="range" min="800" max="16000" step="200" value="4000" /></label>
          <label class="row" data-raster-only hidden><span><span data-i18n="lab.fillRatio">填充占比</span> <b id="v-fillRatio"></b></span><input id="fillRatio" type="range" min="0" max="0.7" step="0.02" value="0" /></label>
          <label class="row"><span><span data-i18n="lab.scatter">星带宽度</span> <b id="v-scatter"></b></span><input id="scatter" type="range" min="0" max="0.14" step="0.001" value="0.041" /></label>
          <label class="row"><span><span data-i18n="lab.backgroundRatio">背景星</span> <b id="v-backgroundRatio"></b></span><input id="backgroundRatio" type="range" min="0" max="1.2" step="0.02" value="0.14" /></label>
          <label class="row"><span><span data-i18n="lab.rotationDepth">厚度</span> <b id="v-rotationDepth"></b></span><input id="rotationDepth" type="range" min="0" max="2" step="0.05" value="1.4" /></label>
          <label class="row" data-shape-only hidden><span><span data-i18n="lab.depth">体积</span> <b id="v-depth"></b></span><input id="depth" type="range" min="0" max="0.3" step="0.005" value="0.1" /></label>
          <label class="row"><span><span data-i18n="lab.size">星星大小</span> <b id="v-size"></b></span><input id="size" type="range" min="0.3" max="3" step="0.05" value="2.05" /></label>
          <label class="row"><span><span data-i18n="lab.sizeFalloff">端点衰减</span> <b id="v-sizeFalloff"></b></span><input id="sizeFalloff" type="range" min="0" max="1" step="0.02" value="0.45" /></label>
          <label class="row"><span data-i18n="lab.palette">调色板</span>
            <select id="palette">
              <option value="astra" data-i18n="lab.palette.astra">Astra（原站）</option>
              <option value="aurora">Aurora</option>
              <option value="ember">Ember</option>
              <option value="ice">Ice</option>
              <option value="gold">Gold</option>
            </select>
          </label>
        </section>

        <section>
          <h2 data-i18n="lab.optics">光学</h2>
          <label class="row"><span><span data-i18n="lab.bloomIntensity">Bloom 强度</span> <b id="v-bloomIntensity"></b></span><input id="bloomIntensity" type="range" min="0" max="2" step="0.05" value="0.7" /></label>
          <label class="row"><span><span data-i18n="lab.bloomThreshold">Bloom 阈值</span> <b id="v-bloomThreshold"></b></span><input id="bloomThreshold" type="range" min="0" max="0.6" step="0.01" value="0.08" /></label>
          <label class="row"><span><span data-i18n="lab.intensity">整体亮度</span> <b id="v-intensity"></b></span><input id="intensity" type="range" min="0.2" max="3" step="0.05" value="1.35" /></label>
          <label class="row"><span><span data-i18n="lab.flare">镜头光晕</span> <b id="v-flare"></b></span><input id="flare" type="range" min="0" max="1" step="0.02" value="0.28" /></label>
          <label class="row"><span data-i18n="lab.ambientColor">氛围色</span><input id="ambientColor" type="color" value="#23435F" /></label>
        </section>

        <section>
          <h2 data-i18n="lab.motion">动态</h2>
          <label class="row"><span><span data-i18n="lab.flowSpeed">流动速度</span> <b id="v-flowSpeed"></b></span><input id="flowSpeed" type="range" min="0" max="3" step="0.05" value="0.8" /></label>
          <label class="row"><span><span data-i18n="lab.twinkleSpeed">闪烁速度</span> <b id="v-twinkleSpeed"></b></span><input id="twinkleSpeed" type="range" min="0" max="2" step="0.02" value="0.62" /></label>
          <label class="row"><span><span data-i18n="lab.trailLength">光带长度</span> <b id="v-trailLength"></b></span><input id="trailLength" type="range" min="0" max="0.6" step="0.01" value="0" /></label>
          <label class="row"><span><span data-i18n="lab.trailSpeed">光带速度</span> <b id="v-trailSpeed"></b></span><input id="trailSpeed" type="range" min="0" max="0.5" step="0.01" value="0.09" /></label>
          <label class="row check"><input id="pointerRepel" type="checkbox" checked /><span data-i18n="lab.pointerRepel">指针推斥（GPGPU）</span></label>
          <label class="row check"><input id="lensMode" type="checkbox" /><span data-i18n="lab.lensMode">指针透镜放大</span></label>
          <label class="row check"><input id="coreSpin" type="checkbox" checked /><span data-i18n="lab.coreSpin">星系核自转</span></label>
          <label class="row check"><input id="autoRotate" type="checkbox" /><span data-i18n="lab.autoRotate">自动微转</span></label>
        </section>

        <div class="actions">
          <button type="button" id="replay" data-i18n="lab.replay">重播入场</button>
          <button type="button" id="disperse" data-i18n="lab.disperse">散开 / 聚合</button>
        </div>
        <p class="stats" id="stats"></p>
      </div>
    </aside>

    <script type="module" src="/src/lab.js"></script>
  </body>
</html>
